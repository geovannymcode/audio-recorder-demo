# ═══ OpenAI ═══
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Whisper config
spring.ai.openai.audio.transcription.model=whisper-1
spring.ai.openai.audio.transcription.language=es
spring.ai.openai.audio.transcription.response-format=text

# Vaadin — allow the addon package to be scanned
vaadin.allowed-packages=com.vaadin,org.vaadin,dev.hilla,org.vaadin.addons

server.port=8081
