# ═══ OpenAI ═══
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.port

# Whisper config
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=es
spring.ai.openai.audio.transcription.options.response-format=text

# Vaadin — allow the addon package to be scanned
vaadin.allowed-packages=com.vaadin,org.vaadin,dev.hilla,org.vaadin.addons

server.port=8081
